<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your account | Sentinel</title><link rel="stylesheet" href="/auth.css"><script src="/auth.js" defer></script></head>
<body class="auth-page"><header class="account-header"><a id="account-home" href="/">← My dashboard</a><nav class="auth-nav"><span id="auth-user"></span><button type="button" id="logout">Sign out</button></nav></header><main class="account-shell"><h1>Your account</h1><p class="auth-muted">Manage your sign-in password.</p><section class="auth-card"><h2>Change password</h2><form id="password-form"><label>Current password<input name="current_password" type="password" autocomplete="current-password" required maxlength="128"></label><label>New password<input name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><p class="auth-muted auth-small">Use at least 12 characters. Changing your password signs you out on all devices.</p><button class="auth-primary" type="submit">Save password</button><p class="auth-message" id="password-message" role="status"></p></form></section>
</main></body></html>
