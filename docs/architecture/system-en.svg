<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1620" viewBox="0 0 1600 1620" role="img" aria-labelledby="title desc">
<title id="title">ESP32-S3 hardware and cloud inference architecture</title>
<desc id="desc">Two separate ESP32-S3 boards provide direct LAN preview and camera capture. The camera uploads JPEGs with a bearer token over Wi-Fi and HTTPS. Dashboard saves frames into event storage. worker.py checks each complete event with YOLO. All false detections discard photos as normal and skip Qwen. Any positive detection sends all ordered frames to Qwen-LoRA for a verdict and evidence. Policy stores a device-facing result. The camera polls via HTTPS for up to 60 seconds and alarms only on suspicious; normal, review, exempted and timeout do not trigger an alarm. Optional family exemption is disabled by default. Incomplete events and inference errors retain evidence for review. In normal mode, PIR warms for 30 seconds and arms after an inactive LOW reading. Motion HIGH requests a burst. The request waits for pending uploads, AI polling and camera ownership to clear, expires after 10 seconds if not accepted, and captures up to five JPEGs when accepted. Rearming requires LOW and the 10-second cooldown after the previous capture.</desc>
